<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SaaS IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            padding: 10px;
            overflow: hidden;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 85vh;
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .chat-header {
            padding: 15px 20px;
            background-color: #121214;
            border-bottom: 1px solid #29292e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-header h2 {
            font-size: 1.1rem;
            color: #00b37e;
        }
        .auth-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .auth-section span {
            font-size: 0.85rem;
            color: #e1e1e6;
        }
        .btn-auth-main {
            background-color: #00b37e;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-auth-main:hover {
            background-color: #00875f;
        }
        .btn-logout {
            color: #ff5555;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .btn-logout:hover {
            text-decoration: underline;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            -webkit-overflow-scrolling: touch;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .message.bot {
            align-self: flex-start;
            background-color: #29292e;
            color: #e1e1e6;
        }
        .message.user {
            align-self: flex-end;
            background-color: #00875f;
            color: #ffffff;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #121214;
            border-top: 1px solid #29292e;
            gap: 10px;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid #29292e;
            background-color: #202024;
            color: #e1e1e6;
            outline: none;
            font-size: 16px; /* Empêche le zoom automatique sur iOS */
        }
        .chat-input-area input:focus {
            border-color: #00b37e;
        }
        .chat-input-area button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #00b37e;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
        .chat-input-area button:hover {
            background-color: #00875f;
        }

        /* Styles de la Fenêtre Modale (Popup Auth) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal-content {
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none;
            color: #a8a8b3; font-size: 1.2rem;
            cursor: pointer;
        }
        .modal-tabs {
            display: flex;
            border-bottom: 1px solid #29292e;
            gap: 15px;
            margin-bottom: 5px;
        }
        .modal-tab {
            background: none; border: none;
            color: #a8a8b3; font-size: 1rem;
            padding-bottom: 10px; cursor: pointer;
            font-weight: bold;
        }
        .modal-tab.active {
            color: #00b37e;
            border-bottom: 2px solid #00b37e;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .auth-form input {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #29292e;
            background-color: #121214;
            color: #e1e1e6;
            font-size: 16px;
            outline: none;
        }
        .auth-form input:focus {
            border-color: #00b37e;
        }
        .btn-submit {
            background-color: #00b37e;
            color: #fff; padding: 12px;
            border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer;
        }
        .btn-submit:hover { background-color: #00875f; }
        .divider {
            text-align: center; color: #a8a8b3; font-size: 0.85rem;
            position: relative; margin: 5px 0;
        }
        .divider::before, .divider::after {
            content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background-color: #29292e;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .btn-google-modal {
            background-color: #4285F4; color: #fff;
            padding: 12px; border-radius: 6px;
            text-decoration: none; text-align: center;
            font-weight: bold; font-size: 0.9rem;
            display: block;
        }
        .btn-google-modal:hover { background-color: #357ae8; }
        .error-msg {
            color: #ff5555; font-size: 0.85rem; text-align: center; display: none;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h2>Assistant IA - Mentor Business</h2>
            <div class="auth-search">
                <div class="auth-section">
                    {% if user %}
                        <span>Bonjour, {{ user.name }}</span>
                        <a href="/logout" class="btn-logout">Déconnexion</a>
                    {% else %}
                        <button type="button" class="btn-auth-main" id="open-auth-modal">Se connecter / S'inscrire</button>
                    {% endif %}
                </div>
            </div>
        </header>

        <div id="chat-box" class="chat-box">
            <div class="message bot">Bonjour ! Comment puis-je t'aider aujourd'hui ?</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Écris ton message ici..." autocomplete="off">
            <button type="button" id="send-btn">Envoyer</button>
        </div>
    </div>

    <!-- Fenêtre Modale d'Authentification -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-content">
            <button class="modal-close" id="close-auth-modal">&times;</button>
            <div class="modal-tabs">
                <button class="modal-tab active" data-target="login-form-container">Connexion</button>
                <button class="modal-tab" data-target="register-form-container">Inscription</button>
            </div>

            <p class="error-msg" id="modal-error"></p>

            <!-- Formulaire de Connexion Email -->
            <div id="login-form-container" class="auth-form-container">
                <form id="login-form" class="auth-form">
                    <input type="email" id="login-email" placeholder="Adresse email" required>
                    <input type="password" id="login-password" placeholder="Mot de passe" required>
                    <button type="submit" class="btn-submit">Se connecter</button>
                </form>
            </div>

            <!-- Formulaire d'Inscription Email -->
            <div id="register-form-container" class="auth-form-container" style="display: none;">
                <form id="register-form" class="auth-form">
                    <input type="text" id="register-name" placeholder="Votre prénom / nom" required>
                    <input type="email" id="register-email" placeholder="Adresse email" required>
                    <input type="password" id="register-password" placeholder="Mot de passe" required>
                    <button type="submit" class="btn-submit">S'inscrire</button>
                </form>
            </div>

            <div class="divider">ou</div>
            <a href="/login" class="btn-google-modal">Se connecter avec Google</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Gestion de la modale
            const modal = document.getElementById('auth-modal');
            const openBtn = document.getElementById('open-auth-modal');
            const closeBtn = document.getElementById('close-auth-modal');
            const tabs = document.querySelectorAll('.modal-tab');
            const loginContainer = document.getElementById('login-form-container');
            const registerContainer = document.getElementById('register-form-container');
            const errorMsg = document.getElementById('modal-error');

            if (openBtn) {
                openBtn.addEventListener('click', () => modal.style.display = 'flex');
            }
            if (closeBtn) {
                closeBtn.addEventListener('click', () => modal.style.display = 'none');
            }
            window.addEventListener('click', (e) => {
                if (e.target === modal) modal.style.display = 'none';
            });

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    errorMsg.style.display = 'none';
                    if (tab.dataset.target === 'login-form-container') {
                        loginContainer.style.display = 'block';
                        registerContainer.style.display = 'none';
                    } else {
                        loginContainer.style.display = 'none';
                        registerContainer.style.display = 'block';
                    }
                });
            });

            // Soumission Connexion Email
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.style.display = 'none';
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                try {
                    const res = await fetch('/api/login-email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        window.location.reload();
                    } else {
                        errorMsg.textContent = data.error || "Erreur de connexion";
                        errorMsg.style.display = 'block';
                    }
                } catch (err) {
                    errorMsg.textContent = "Erreur réseau.";
                    errorMsg.style.display = 'block';
                }
            });

            // Soumission Inscription Email
            document.getElementById('register-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.style.display = 'none';
                const name = document.getElementById('register-name').value;
                const email = document.getElementById('register-email').value;
                const password = document.getElementById('register-password').value;

                try {
                    const res = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, password })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        window.location.reload();
                    } else {
                        errorMsg.textContent = data.error || "Erreur lors de l'inscription";
                        errorMsg.style.display = 'block';
                    }
                } catch (err) {
                    errorMsg.textContent = "Erreur réseau.";
                    errorMsg.style.display = 'block';
                }
            });

            // Logique du chat
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const chatBox = document.getElementById('chat-box');
            let conversationHistory = [];

            function appendMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', sender);
                messageDiv.textContent = text;
                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
                return messageDiv;
            }

            async function handleSendMessage() {
                const message = userInput.value.trim();
                if (!message) return;

                appendMessage(message, 'user');
                conversationHistory.push({ role: "user", content: message });
                userInput.value = '';

                const loadingMessage = appendMessage('Réflexion en cours...', 'bot');

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ history: conversationHistory })
                    });

                    const data = await response.json();

                    if (data.reply) {
                        loadingMessage.textContent = data.reply;
                        conversationHistory.push({ role: "assistant", content: data.reply });
                    } else if (data.error) {
                        loadingMessage.textContent = "Erreur : " + data.error;
                        conversationHistory.pop();
                    }
                } catch (error) {
                    loadingMessage.textContent = "Impossible de contacter le serveur.";
                }

                chatBox.scrollTop = chatBox.scrollHeight;
                // Redonne le focus proprement et force le défilement
                userInput.focus();
            }

            if (sendBtn) sendBtn.addEventListener('click', handleSendMessage);
            if (userInput) {
                userInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleSendMessage();
                    }
                });
            }
        });
    </script>
</body>
</html>
