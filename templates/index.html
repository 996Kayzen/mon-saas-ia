<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Business</title>
    <style>
        /* --- RESET & VARIABLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-main: #131313;
            --bg-sidebar: #0d0d0d;
            --bg-input: #1e1e1e;
            --bg-hover: #262626;
            --border-color: #2a2a2a;
            --gold-primary: #d4af37;
            --gold-hover: #e6c547;
            --text-main: #f3f3f3;
            --text-muted: #888888;
            --sidebar-width: 280px;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
        }

        body {
            display: flex;
            position: relative;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            transform: translateX(0);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn {
            margin: 15px;
            padding: 12px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: left;
        }

        .new-chat-btn:hover {
            background-color: var(--bg-hover);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 10px 10px;
        }

        .history-item {
            padding: 10px 12px;
            margin-bottom: 5px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s, color 0.2s;
        }

        .history-item:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        .history-item.active {
            background-color: var(--bg-hover);
            color: var(--gold-primary);
            font-weight: 500;
        }

        /* --- OVERLAY MOBILE --- */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 99;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* --- MAIN WRAPPER --- */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin-left: var(--sidebar-width);
            width: calc(100vw - var(--sidebar-width));
            position: relative;
            transition: margin-left 0.3s ease, width 0.3s ease;
        }

        .main-wrapper.sidebar-closed {
            margin-left: 0 !important;
            width: 100vw !important;
        }

        @media (max-width: 767px) {
            .main-wrapper {
                margin-left: 0 !important;
                width: 100vw !important;
            }
            .sidebar {
                transform: translateX(-100%);
            }
        }

        /* --- TOP BAR --- */
        .top-bar {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color: var(--bg-main);
            flex-shrink: 0;
            transition: padding-left 0.3s ease;
        }

        .main-wrapper.sidebar-closed .top-bar {
            padding-left: 15px;
        }

        /* BOUTON TOGGLE CUSTOM (Carré, fond rond, lignes intérieures) */
        .toggle-sidebar-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-icon-box {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            transition: background 0.2s, border-color 0.2s;
        }

        .custom-icon-box:hover {
            background-color: var(--bg-hover);
            border-color: var(--gold-primary);
        }

        .custom-icon-bar {
            width: 16px;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
        }

        /* Bouton toggle flottant visible sur mobile même quand le menu est ouvert */
        .mobile-floating-toggle {
            display: none;
            position: fixed;
            top: 11px;
            left: 15px;
            z-index: 101;
        }

        @media (max-width: 767px) {
            .mobile-floating-toggle {
                display: flex;
            }
        }

        .auth-section {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
        }

        .btn-auth-main {
            background-color: var(--gold-primary);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-auth-main:hover {
            background-color: var(--gold-hover);
        }

        .btn-logout {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .btn-logout:hover {
            color: var(--text-main);
        }

        /* --- CHAT AREA --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .welcome-greeting-container {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            max-width: 600px;
            z-index: 10;
        }

        .welcome-greeting {
            font-size: 1.8rem;
            color: var(--gold-primary);
            font-weight: 600;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
            padding-bottom: 120px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background-color: var(--bg-input);
            color: var(--text-main);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background-color: transparent;
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .scroll-bottom-btn {
            display: none;
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 20;
            transition: background 0.2s;
        }

        .scroll-bottom-btn:hover {
            background-color: var(--bg-hover);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }

        /* --- INPUT CONTAINER --- */
        .chat-input-container {
            padding: 20px;
            background: linear-gradient(to top, var(--bg-main) 80%, transparent);
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 30;
        }

        .chat-input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 12px;
            align-items: center;
            transition: border-color 0.2s;
        }

        .chat-input-wrapper:focus-within {
            border-color: var(--gold-primary);
        }

        #user-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 8px;
            outline: none;
        }

        #user-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: none;
            border: none;
            color: var(--gold-primary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.1);
        }

        /* --- MODALE D'AUTHENTIFICATION --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--text-main);
        }

        .modal-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-tab {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .modal-tab.active {
            color: var(--gold-primary);
            border-bottom-color: var(--gold-primary);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form input {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .auth-form input:focus {
            border-color: var(--gold-primary);
        }

        .btn-submit {
            background-color: var(--gold-primary);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--gold-hover);
        }

        .error-msg {
            color: #ff5555;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            position: relative;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: var(--border-color);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .btn-google-modal {
            display: block;
            text-align: center;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-google-modal:hover {
            background-color: var(--bg-hover);
        }
    </style>
</head>
<body data-is-logged-in="{% if user %}true{% else %}false{% endif %}">

    <!-- VOILE SOMBRE ARRIÈRE-PLAN MOBILE -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- BOUTON FLOTTANT MOBILE (Visible en permanence même menu ouvert) -->
    <button class="toggle-sidebar-btn mobile-floating-toggle" id="toggle-sidebar-mobile" title="Menu">
        <div class="custom-icon-box">
            <div class="custom-icon-bar"></div>
            <div class="custom-icon-bar"></div>
            <div class="custom-icon-bar"></div>
        </div>
    </button>

    <!-- MENU LATÉRAL -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 style="color: #d4af37; font-size: 1rem; font-weight: 600;">Mentor Business</h3>
        </div>
        <button class="new-chat-btn" id="new-chat-btn">+ Nouveau chat</button>
        <div class="history-list" id="history-list"></div>
    </aside>

    <!-- WRAPPER PRINCIPAL -->
    <div class="main-wrapper" id="main-wrapper">
        <header class="top-bar">
            <button class="toggle-sidebar-btn" id="toggle-sidebar-pc" title="Barre latérale">
                <div class="custom-icon-box">
                    <div class="custom-icon-bar"></div>
                    <div class="custom-icon-bar"></div>
                    <div class="custom-icon-bar"></div>
                </div>
            </button>
            <div class="auth-section">
                {% if user %}
                    <span>Bonjour, {{ user.name }}</span>
                    <a href="/logout" class="btn-logout">Déconnexion</a>
                {% else %}
                    <button type="button" class="btn-auth-main" id="open-auth-modal">Se connecter / S'inscrire</button>
                {% endif %}
            </div>
        </header>

        <div class="chat-area">
            <div class="welcome-greeting-container" id="welcome-container">
                <h1 class="welcome-greeting" id="gold-greeting">Par quoi commençons-nous aujourd'hui ?</h1>
            </div>

            <div id="chat-box" class="chat-box">
                <!-- Bouton pour défiler vers le bas -->
                <button class="scroll-bottom-btn" id="scroll-bottom-btn" title="Aller tout en bas">&#8595;</button>
            </div>

            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <input type="text" id="user-input" placeholder="Posez votre question business..." autocomplete="off">
                    <button type="button" class="send-btn" id="send-btn">&#10148;</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALE D'AUTHENTIFICATION -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-content">
            <button class="modal-close" id="close-auth-modal">&times;</button>
            <div class="modal-tabs">
                <button class="modal-tab active" data-target="login-form-container">Connexion</button>
                <button class="modal-tab" data-target="register-form-container">Inscription</button>
            </div>

            <p class="error-msg" id="modal-error"></p>

            <div id="login-form-container" class="auth-form-container">
                <form id="login-form" class="auth-form">
                    <input type="email" id="login-email" placeholder="Adresse email" required>
                    <input type="password" id="login-password" placeholder="Mot de passe" required>
                    <button type="submit" class="btn-submit">Se connecter</button>
                </form>
            </div>

            <div id="register-form-container" class="auth-form-container" style="display: none;">
                <form id="register-form" class="auth-form">
                    <input type="text" id="register-name" placeholder="Votre prénom / nom" required>
                    <input type="email" id="register-email" placeholder="Adresse email" required>
                    <input type="password" id="register-password" placeholder="Mot de passe" required>
                    <button type="submit" class="btn-submit">S'inscrire</button>
                </form>
            </div>

            <div class="divider">ou</div>
            <a href="/login" class="btn-google-modal">Se connecter avec Google</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const greetings = [
                "Par quoi commençons-nous aujourd'hui ?",
                "Avez-vous un projet en tête ?",
                "Voulez-vous commencer un Business ?",
                "Avez-vous besoin d'aide sur la conception d'un projet ?",
                "Manquez-vous d'idées ?"
            ];
            const greetingEl = document.getElementById('gold-greeting');
            if (greetingEl) {
                greetingEl.textContent = greetings[Math.floor(Math.random() * greetings.length)];
            }

            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const togglePcBtn = document.getElementById('toggle-sidebar-pc');
            const toggleMobileBtn = document.getElementById('toggle-sidebar-mobile');
            const mainWrapper = document.getElementById('main-wrapper');
            
            const sidebarWidth = 280;
            let isSidebarOpen = window.innerWidth >= 768;

            function applySidebarState(open, animate = true) {
                isSidebarOpen = open;
                if (window.innerWidth >= 768) {
                    sidebar.style.transition = animate ? 'transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1)' : 'none';
                    sidebar.style.transform = open ? 'translateX(0)' : 'translateX(-100%)';
                    
                    if (open) {
                        mainWrapper.classList.remove('sidebar-closed');
                    } else {
                        mainWrapper.classList.add('sidebar-closed');
                    }
                    overlay.style.display = 'none';
                } else {
                    sidebar.style.transition = animate ? 'transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1)' : 'none';
                    overlay.style.transition = animate ? 'opacity 0.3s ease' : 'none';
                    mainWrapper.classList.add('sidebar-closed');

                    if (open) {
                        sidebar.style.transform = 'translateX(0)';
                        overlay.style.display = 'block';
                        overlay.style.opacity = '1';
                    } else {
                        sidebar.style.transform = `translateX(-${sidebarWidth}px)`;
                        overlay.style.opacity = '0';
                        setTimeout(() => {
                            if (!isSidebarOpen) overlay.style.display = 'none';
                        }, 300);
                    }
                }
            }

            applySidebarState(isSidebarOpen, false);

            const toggleMenu = () => {
                applySidebarState(!isSidebarOpen, true);
            };

            if (togglePcBtn) togglePcBtn.addEventListener('click', toggleMenu);
            if (toggleMobileBtn) toggleMobileBtn.addEventListener('click', toggleMenu);

            if (overlay) {
                overlay.addEventListener('click', () => {
                    applySidebarState(false, true);
                });
            }

            // Gestion tactile globale optimisée
            let touchStartX = 0;
            let touchStartY = 0;
            let initialTransformX = 0;
            let isSwiping = false;

            document.addEventListener('touchstart', (e) => {
                if (window.innerWidth >= 768) return;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                
                let matchTransform = sidebar.style.transform.match(/translateX\(([-\d.]+)px\)/);
                initialTransformX = matchTransform ? parseFloat(matchTransform[1]) : (isSidebarOpen ? 0 : -sidebarWidth);

                isSwiping = true;
                sidebar.style.transition = 'none';
                overlay.style.transition = 'none';
            }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                if (!isSwiping || window.innerWidth >= 768) return;
                
                let currentTouchX = e.touches[0].clientX;
                let currentTouchY = e.touches[0].clientY;
                
                let diffX = currentTouchX - touchStartX;
                let diffY = Math.abs(currentTouchY - touchStartY);

                if (diffY > Math.abs(diffX) && Math.abs(diffX) < 10) {
                    isSwiping = false;
                    return;
                }

                let newX = initialTransformX + diffX;
                if (newX > 0) newX = 0;
                if (newX < -sidebarWidth) newX = -sidebarWidth;

                sidebar.style.transform = `translateX(${newX}px)`;
                
                let percent = (newX + sidebarWidth) / sidebarWidth;
                overlay.style.display = 'block';
                overlay.style.opacity = percent;
            }, { passive: true });

            document.addEventListener('touchend', () => {
                if (!isSwiping || window.innerWidth >= 768) return;
                isSwiping = false;

                let matchTransform = sidebar.style.transform.match(/translateX\(([-\d.]+)px\)/);
                let finalX = matchTransform ? parseFloat(matchTransform.groups ? matchTransform.groups[1] : matchTransform[1]) : -sidebarWidth;

                if (finalX > -sidebarWidth / 2) {
                    applySidebarState(true, true);
                } else {
                    applySidebarState(false, true);
                }
            }, { passive: true });

            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768) {
                    applySidebarState(true, false);
                } else {
                    applySidebarState(false, false);
                }
            });

            // Gestion Authentification Modale
            const modal = document.getElementById('auth-modal');
            const openAuthBtn = document.getElementById('open-auth-modal');
            const closeAuthBtn = document.getElementById('close-auth-modal');
            const tabs = document.querySelectorAll('.modal-tab');
            const loginContainer = document.getElementById('login-form-container');
            const registerContainer = document.getElementById('register-form-container');
            const errorMsg = document.getElementById('modal-error');

            if (openAuthBtn) openAuthBtn.addEventListener('click', () => modal.style.display = 'flex');
            if (closeAuthBtn) closeAuthBtn.addEventListener('click', () => modal.style.display = 'none');
            window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    if (errorMsg) errorMsg.style.display = 'none';
                    if (tab.dataset.target === 'login-form-container') {
                        if (loginContainer) loginContainer.style.display = 'block';
                        if (registerContainer) registerContainer.style.display = 'none';
                    } else {
                        if (loginContainer) loginContainer.style.display = 'none';
                        if (registerContainer) registerContainer.style.display = 'block';
                    }
                });
            });

            const handleAuthSubmit = async (url, payload) => {
                if (errorMsg) errorMsg.style.display = 'none';
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        window.location.reload();
                    } else {
                        if (errorMsg) {
                            errorMsg.textContent = data.error || "Erreur";
                            errorMsg.style.display = 'block';
                        }
                    }
                } catch (err) {
                    if (errorMsg) {
                        errorMsg.textContent = "Erreur réseau.";
                        errorMsg.style.display = 'block';
                    }
                }
            };

            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    handleAuthSubmit('/api/login-email', {
                        email: document.getElementById('login-email').value,
                        password: document.getElementById('login-password').value
                    });
                });
            }

            const registerForm = document.getElementById('register-form');
            if (registerForm) {
                registerForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    handleAuthSubmit('/api/register', {
                        name: document.getElementById('register-name').value,
                        email: document.getElementById('register-email').value,
                        password: document.getElementById('register-password').value
                    });
                });
            }

            // Logique Chat & Historique
            const chatBox = document.getElementById('chat-box');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const historyList = document.getElementById('history-list');
            const newChatBtn = document.getElementById('new-chat-btn');
            const welcomeContainer = document.getElementById('welcome-container');
            const scrollBottomBtn = document.getElementById('scroll-bottom-btn');

            const isLoggedIn = document.body.getAttribute('data-is-logged-in') === 'true';
            let currentConversationId = 'conv_' + Date.now();
            let conversationHistory = [];
            let localGuestConversations = JSON.parse(sessionStorage.getItem('guest_convs') || '{}');

            function updateWelcomeVisibility() {
                if (!chatBox || !welcomeContainer) return;
                if (chatBox.querySelectorAll('.message').length === 0) {
                    welcomeContainer.style.display = 'block';
                } else {
                    welcomeContainer.style.display = 'none';
                }
            }

            if (chatBox) {
                chatBox.addEventListener('scroll', () => {
                    const scrollPosition = chatBox.scrollTop + chatBox.clientHeight;
                    const bottomThreshold = chatBox.scrollHeight - 100;
                    if (scrollPosition < bottomThreshold) {
                        scrollBottomBtn.style.display = 'flex';
                    } else {
                        scrollBottomBtn.style.display = 'none';
                    }
                });
            }

            if (scrollBottomBtn) {
                scrollBottomBtn.addEventListener('click', () => {
                    chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
                });
            }

            function cleanTextContent(text) {
                if (!text) return "";
                let lines = text.split('\n');
                let cleanedLines = lines.filter(line => !/^-+$/.test(line.trim()));
                return cleanedLines.join('\n').trim();
            }

            async function loadConversationsList() {
                if (!historyList) return;
                if (isLoggedIn) {
                    try {
                        const res = await fetch('/api/conversations');
                        const convs = await res.json();
                        historyList.innerHTML = '';
                        convs.forEach(c => {
                            const div = document.createElement('div');
                            div.className = 'history-item' + (c.id === currentConversationId ? ' active' : '');
                            div.textContent = c.title;
                            div.addEventListener('click', () => switchToConversation(c.id));
                            historyList.appendChild(div);
                        });
                    } catch (e) { console.error(e); }
                } else {
                    historyList.innerHTML = '';
                    Object.keys(localGuestConversations).forEach(id => {
                        const div = document.createElement('div');
                        div.className = 'history-item' + (id === currentConversationId ? ' active' : '');
                        div.textContent = localGuestConversations[id].title;
                        div.addEventListener('click', () => switchToGuestConversation(id));
                        historyList.appendChild(div);
                    });
                }
            }

            async function switchToConversation(id) {
                currentConversationId = id;
                conversationHistory = [];
                if (chatBox) {
                    chatBox.querySelectorAll('.message').forEach(m => m.remove());
                }
                try {
                    const res = await fetch(`/api/conversations/${id}/messages`);
                    const messages = await res.json();
                    messages.forEach(m => {
                        appendMessage(m.content, m.role === 'user' ? 'user' : 'bot', false);
                        conversationHistory.push({ role: m.role, content: m.content });
                    });
                } catch (e) { console.error(e); }
                updateWelcomeVisibility();
                loadConversationsList();
            }

            function switchToGuestConversation(id) {
                currentConversationId = id;
                if (chatBox) {
                    chatBox.querySelectorAll('.message').forEach(m => m.remove());
                }
                conversationHistory = localGuestConversations[id].messages || [];
                conversationHistory.forEach(m => {
                    appendMessage(m.content, m.role === 'user' ? 'user' : 'bot', false);
                });
                updateWelcomeVisibility();
                loadConversationsList();
            }

            if (newChatBtn) {
                newChatBtn.addEventListener('click', () => {
                    currentConversationId = 'conv_' + Date.now();
                    conversationHistory = [];
                    if (chatBox) {
                        chatBox.querySelectorAll('.message').forEach(m => m.remove());
                    }
                    updateWelcomeVisibility();
                    loadConversationsList();
                });
            }

            function appendMessage(text, sender, scrollToElement = true) {
                if (!chatBox) return;
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', sender);
                messageDiv.textContent = cleanTextContent(text);
                chatBox.insertBefore(messageDiv, scrollBottomBtn);
                
                if (scrollToElement) {
                    messageDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
                updateWelcomeVisibility();
                return messageDiv;
            }

            async function handleSendMessage() {
                if (!userInput) return;
                const message = userInput.value.trim();
                if (!message) return;

                appendMessage(message, 'user', true);
                conversationHistory.push({ role: "user", content: message });
                userInput.value = '';

                if (!isLoggedIn) {
                    let words = message.split(' ').slice(0, 4).join(' ');
                    let title = (words.length > 25) ? words.substring(0, 25) + '...' : words;
                    title = title.charAt(0).toUpperCase() + title.slice(1);
                    
                    localGuestConversations[currentConversationId] = {
                        title: title,
                        messages: conversationHistory
                    };
                    sessionStorage.setItem('guest_convs', JSON.stringify(localGuestConversations));
                    loadConversationsList();
                }

                const loadingMessage = appendMessage('Réflexion en cours...', 'bot', true);

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            history: conversationHistory,
                            conversation_id: currentConversationId
                        })
                    });

                    const data = await response.json();

                    if (data.reply) {
                        loadingMessage.textContent = cleanTextContent(data.reply);
                        conversationHistory.push({ role: "assistant", content: data.reply });
                        
                        if (!isLoggedIn) {
                            localGuestConversations[currentConversationId].messages = conversationHistory;
                            sessionStorage.setItem('guest_convs', JSON.stringify(localGuestConversations));
                        } else {
                            loadConversationsList();
                        }
                    } else if (data.error) {
                        loadingMessage.textContent = "Erreur : " + data.error;
                        conversationHistory.pop();
                    }
                } catch (error) {
                    loadingMessage.textContent = "Impossible de contacter le serveur.";
                }
                userInput.focus();
            }

            if (sendBtn) sendBtn.addEventListener('click', handleSendMessage);
            if (userInput) {
                userInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleSendMessage();
                    }
                });
            }

            updateWelcomeVisibility();
            loadConversationsList();
        });
    </script>
</body>
</html>
